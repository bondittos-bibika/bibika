:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1d22;--mut:#6b7280;--ac:#0a66d8;--acx:#fff;--bd:#e3e5ea;--dg:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--mut:#9aa1ad;--ac:#4c9aff;--acx:#0b1220;--bd:#2a2e38;--dg:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--mut:#9aa1ad;--ac:#4c9aff;--acx:#0b1220;--bd:#2a2e38;--dg:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 16px}h2{font-size:15px;margin:20px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}

.mut{color:var(--mut);font-size:14px}

var NH='https://vpic.nhtsa.dot.gov/api/vehicles',modelCache={};

    '<div><label>Пробіг, км</label><input id="l_km" type="number" inputmode="numeric" placeholder="'+(last?esc(last.km):'')+'" value="'+esc(l2.km)+'"></div></div>'+
    '<label>Що зробили / замінили</label><textarea id="l_work" placeholder="Олива й фільтр, повітряний фільтр, колодки…">'+esc(l2.work)+'</textarea>'+
        '<label>Вартість, грн</label><input id="l_cost" type="number" inputmode="decimal" value="'+esc(l2.cost)+'">'+
    '<label>Нотатки (сервіс тощо)</label><textarea id="l_notes">'+esc(l2.notes)+'</textarea>'+
    '<button onclick="saveLog()">Зберегти</button>'+(V.lid?'<button class="dng" onclick="delLog()">Видалити запис</button>':'');
  }
  a.innerHTML=h;
  if(V.name==='carform')updModels();
}
function saveCar(){
  var o={make:$('f_make').value.trim(),model:$('f_model').value.trim(),year:$('f_year').value.trim(),gearbox:$('f_gearbox').value.trim(),engine:$('f_engine').value.trim(),vin:normVin($('f_vin').value)};
  if(!o.make&&!o.model){toast('Вкажіть марку або модель');return}
  if(V.id){var c=car(V.id),old=JSON.stringify(strip(c));Object.keys(o).forEach(function(k){c[k]=o[k]});saveRow(c).then(function(){go('car',V.id)},fail)}
  else{o.id=uid();o.logs=[];saveRow(o).then(function(){CARS.push(o);notifyEvt('new_car',{car:o});go('car',o.id)},fail)}
}
function delCar(){if(confirm('Видалити авто та всю його історію?'))api('DELETE','/cars?id=eq.'+encodeURIComponent(V.id),null,'return=minimal').then(function(){CARS=CARS.filter(function(c){return c.id!==V.id});go('list')},fail)}
function saveLog(){
  var o={date:$('l_date').value,km:$('l_km').value,work:$('l_work').value.trim(),cost:$('l_cost').value.trim(),notes:$('l_notes').value.trim()};
  if(!o.date){toast('Вкажіть дату');return}
  var c=car(V.id),arr=(c.logs||[]).slice();
  if(V.lid){arr=arr.map(function(x){return x.id===V.lid?Object.assign({},x,o):x})}else{o.id=uid();arr.push(o)}
  var isNew=!V.lid;c.logs=arr;saveRow(c).then(function(){if(isNew)notifyEvt('new_record',{car:c,log:o});go('car',V.id)},fail)
}
function delLog(){
  if(!confirm('Видалити запис?'))return;
  var c=car(V.id);c.logs=(c.logs||[]).filter(function(x){return x.id!==V.lid});
  saveRow(c).then(function(){go('car',V.id)},fail)
}
window.addEventListener('hashchange',render);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(V.name==='list'||V.name==='car'))loadCars()});
render();loadCars();
</script>
</body>
</html>
